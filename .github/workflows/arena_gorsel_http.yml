name: 🖼️ Arena Görsel (tarayıcısız okuma)

# AMAÇ: Arena'nın ÜRETTİĞİ görseli kanıtlamak.
#   1) Tarayıcı yalnızca mesajı gönderir (recaptcha jetonu orada üretiliyor).
#   2) Cevap + görsel TARAYICISIZ okunur:
#      GET /api/chat/{id}/events  → görsel hash'i
#      GET /api/chat/workspace/cas/user/{hash} → image/png
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Görsel isteği (Arena'ya gönderilecek)"
        required: true
        default: "Dikey 9:16 YouTube Shorts kapak görseli üret: yuttuğun sakız mideye yapışmış, dramatik makro fotoğraf, lacivert zemin, amber ışık. Yazı olmasın. Dosya: /home/user/kapak.png"

permissions:
  contents: read

jobs:
  gorsel:
    name: Arena görsel üret ve indir
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gönder (tarayıcı) + oku (HTTP) + indir
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ARENA_IDLE_DK: "3"
          ARENA_MAKS_DK: "6"
          ARENA_TESHIS: "0"
          SORU: ${{ inputs.prompt }}
        run: |
          mkdir -p kanit
          python - << 'PYEOF'
          import asyncio, os, sys
          from modules import arena_http, arena_api

          soru = os.environ["SORU"]
          cerez = arena_http._cerez_basligi()
          print(f"❓ İSTEK: {soru[:90]}", flush=True)

          # 0) Gönderim öncesi sohbet listesi (yeni kimliği ayırt etmek için)
          onceki = {k.get("id") for k in arena_http.son_sohbetler(cerez, limit=10)}

          # 1) TARAYICI: sadece gönder
          print("[1/3] Tarayıcı ile gönderiliyor...", flush=True)
          cevap_dom = arena_api.arena_kisa_cevap_al(soru)   # mevcut çalışan yol
          print(f"      DOM cevabı: {(cevap_dom or '(yok)')[:100]}", flush=True)

          # 2) HTTP: yeni sohbet kimliği
          print("[2/3] HTTP: sohbet kimliği aranıyor...", flush=True)
          chat_id = arena_http.sohbet_id_bekle(cerez, onceki, azami_sn=90)
          if not chat_id:
              print("❌ Yeni sohbet kimliği bulunamadı", flush=True)
              sys.exit(1)
          print(f"      chat_id={chat_id}", flush=True)

          # 3) HTTP: akış + görsel
          print("[3/3] HTTP: akış okunuyor...", flush=True)
          akis = arena_http.akisi_oku(chat_id, cerez)
          print(f"      cevap: {(akis['metin'] or '(yok)')[:200]}", flush=True)
          print(f"      görsel yolu: {akis['gorsel_yolu']}", flush=True)
          print(f"      hash: {akis['hash']}", flush=True)
          if not akis["hash"]:
              print("❌ GÖRSEL ÜRETİLMEDİ (akışta hash yok)", flush=True)
              sys.exit(2)
          yol = arena_http.gorsel_indir(akis["hash"], "kanit/arena_kapak.png", cerez)
          if not yol:
              print("❌ GÖRSEL İNDİRİLEMEDİ", flush=True)
              sys.exit(3)
          from PIL import Image
          with Image.open(yol) as im:
              print(f"✅ DOĞRULANDI: {im.size[0]}×{im.size[1]} · {os.path.getsize(yol)} bayt", flush=True)
          open("kanit/cevap.txt","w",encoding="utf-8").write(akis["metin"] or "")
          PYEOF

      - name: Kanıtı yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-gorsel
          path: kanit/
          if-no-files-found: ignore
