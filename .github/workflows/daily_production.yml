name: BOBİ TV — Günlük Üretim Pipeline

on:
  schedule:
    # Her gün UTC 06:00 (Türkiye 09:00)
    - cron: '0 6 * * *'
    # İkinci tur UTC 12:00 (Türkiye 15:00)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Kaç video üretilsin?'
        required: false
        default: '5'

jobs:
  uretim:
    name: Günlük Video Üretimi
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            espeak-ng \
            wget \
            curl \
            fonts-dejavu-core \
            fonts-liberation2 \
            libass9

      - name: Python bağımlılıklarını kur
        run: |
          pip install --upgrade pip
          pip install \
            edge-tts==7.0.0 \
            requests==2.32.3 \
            google-auth==2.35.0 \
            google-auth-httplib2==0.2.0 \
            google-api-python-client==2.151.0 \
            pydub==0.25.1 \
            Pillow==11.0.0 \
            numpy==2.1.3

      - name: Klasör yapısını oluştur
        run: |
          mkdir -p bobi_tv/{queue,production/{scripts,assets/{characters,backgrounds,sfx},tts,animation,render},output,archive/published,logs,config}

      - name: Pipeline'ı çalıştır
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GUNLUK_HEDEF: ${{ github.event.inputs.hedef || '5' }}
        run: |
          python main_pipeline.py

      - name: Arşivi commit et
        if: always()
        run: |
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git add bobi_tv/archive/ bobi_tv/logs/ || true
          git diff --staged --quiet || git commit -m "📺 Günlük arşiv güncellendi [$(date +%Y-%m-%d)]"
          git push || true

      - name: Hata durumunda Telegram bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          requests.post(
            f'https://api.telegram.org/bot{token}/sendMessage',
            json={
              'chat_id': chat_id,
              'text': '🔴 <b>BOBİ TV Pipeline Hatası</b>\nGitHub Actions başarısız oldu.\nDetay: https://github.com/mehetgege3-cmyk/bobi-tv/actions',
              'parse_mode': 'HTML'
            }
          )
          "
