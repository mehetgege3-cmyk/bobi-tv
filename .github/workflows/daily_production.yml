name: BOBİ TV — Toplu Manuel Üretim Pipeline

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Kaç Pro video üretilsin?'
        required: false
        default: '2'

jobs:
  uretim:
    name: Toplu Pro Video Üretimi
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg espeak-ng fonts-dejavu-core fonts-liberation2 libass9

      - name: Python bağımlılıklarını ve Playwright Chromium'u kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Klasör yapısını oluştur
        run: |
          mkdir -p bobi_tv/{queue,assets/{fonts,sfx},production/{scripts/arena,tts,render},output,archive/published,logs,config}

      - name: Pipeline'ı çalıştır
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GUNLUK_HEDEF: ${{ github.event.inputs.hedef || '2' }}
          GUNLUK_MAKS: '20'
          MOD: 'manuel'
        run: |
          python main_pipeline.py

      - name: Üretilen Pro Videoları Artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bobi-tv-toplu-videolar-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 5
          path: |
            bobi_tv/output/*.mp4
            bobi_tv/output/*_thumb.jpg

      - name: Arşivi commit et
        if: always()
        run: |
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git add bobi_tv/archive/ bobi_tv/queue/*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "📺 Toplu arşiv güncellendi [$(date +%Y-%m-%d)] [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi
