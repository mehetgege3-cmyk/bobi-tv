name: BOBİ TV Telegram Bot Poller

on:
  schedule:
    # Her 5 dakikada bir bot mesajlarını kontrol et
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  poll-messages:
    name: Telegram Bot Poll
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q requests

      - name: Bot mesajlarını kontrol et ve işle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python - << 'PYEOF'
          import os
          import json
          import requests
          from pathlib import Path

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not BOT_TOKEN:
              print("❌ TELEGRAM_BOT_TOKEN yok")
              exit(0)

          BASE_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"

          # Offset dosyası
          offset_file = Path("bobi_tv/state/telegram_offset.json")
          offset_file.parent.mkdir(parents=True, exist_ok=True)

          offset = 0
          if offset_file.exists():
              try:
                  offset = json.loads(offset_file.read_text()).get("offset", 0)
              except Exception:
                  pass

          # Get updates
          try:
              resp = requests.post(
                  f"{BASE_URL}/getUpdates",
                  json={"timeout": 5, "offset": offset, "allowed_updates": ["message", "callback_query"]},
                  timeout=15
              )

              if resp.status_code != 200:
                  print(f"❌ API hatası: {resp.status_code}")
                  exit(0)

              data = resp.json()
              if not data.get("ok"):
                  print("❌ API başarısız")
                  exit(0)

              updates = data.get("result", [])

              if not updates:
                  print("ℹ️ Yeni mesaj yok")
                  exit(0)

              # Her update'i işle
              from modules.telegram_bot import handle_message, handle_callback

              for update in updates:
                  offset = update["update_id"] + 1

                  # Callback query
                  if "callback_query" in update:
                      cq = update["callback_query"]
                      callback_id = cq["id"]
                      callback_data = cq.get("data", "")
                      if callback_data:
                          handle_callback(callback_data, callback_id)
                          print(f"✅ Callback işlendi: {callback_data}")

                  # Mesaj
                  elif "message" in update:
                      msg = update["message"]
                      text = msg.get("text", "")
                      if text:
                          handle_message(text)
                          print(f"✅ Mesaj işlendi: {text[:30]}")

              # Offset kaydet
              offset_file.write_text(json.dumps({"offset": offset}))
              print(f"📝 Offset kaydedildi: {offset}")

          except Exception as e:
              print(f"❌ Hata: {e}")
          PYEOF

      - name: State dosyasını commit et
        if: always()
        run: |
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git add -f bobi_tv/state/telegram_offset.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Telegram bot offset [skip ci]" || true
            git push origin main || echo "Push atlandı"
          fi

