name: BOBİ TV Telegram Bot Poller (güvenlik düzeltmeli)

on:
  schedule:
    # Her 5 dakikada bir bot mesajlarını kontrol et
    # (GitHub cron gerçekte daha seyrek çalışabilir; beklenti yönetimi)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  poll-messages:
    name: Telegram Bot Poll
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q requests

      - name: Bot mesajlarını kontrol et ve işle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python - << 'PYEOF'
          import os, json, sys, requests
          from datetime import datetime, timezone
          from pathlib import Path

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")

          # HATA DURUMLARINDA exit(1) — bot ölürse kırmızı tik, sessiz yeşil değil
          if not BOT_TOKEN:
              print("::error::TELEGRAM_BOT_TOKEN secret tanımlı değil")
              sys.exit(1)
          if not CHAT_ID:
              print("::error::TELEGRAM_CHAT_ID secret tanımlı değil")
              sys.exit(1)

          BASE_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"
          offset_file = Path("bobi_tv/state/telegram_offset.json")
          offset_file.parent.mkdir(parents=True, exist_ok=True)

          offset = 0
          offset_guncelleme = None
          if offset_file.exists():
              try:
                  _durum = json.loads(offset_file.read_text())
                  offset = int(_durum.get("offset", 0))
                  offset_guncelleme = _durum.get("guncelleme")
              except Exception:
                  pass

          try:
              resp = requests.post(
                  f"{BASE_URL}/getUpdates",
                  json={"timeout": 5, "offset": offset, "allowed_updates": ["message", "callback_query"]},
                  timeout=15,
              )
          except Exception as e:
              print(f"::error::Telegram API bağlantı hatası: {e}")
              sys.exit(1)

          if resp.status_code != 200:
              print(f"::error::Telegram API HTTP hatası: {resp.status_code}")
              sys.exit(1)

          data = resp.json()
          if not data.get("ok"):
              print(f"::error::Telegram API başarısız: {data}")
              sys.exit(1)

          updates = data.get("result", [])
          if not updates:
              print("ℹ️ Yeni mesaj yok")
              sys.exit(0)  # mesaj yok = başarı

          from modules.telegram_bot import bosuk_uyarisi_gonder, updates_isle

          # TODO 3a: ölü aralık tespiti — beklenen ile gelen update_id arasındaki boşluk.
          # getUpdates 24 saatlik pencere nedeniyle aradaki mesajlar kalıcı kayıptır;
          # kullanıcı bunu en az bir kez açıkça bilmeli.
          bosuk_esigi = int(os.environ.get("TELEGRAM_BOSUK_ESIGI", "3"))
          bosuk = updates[0]["update_id"] - offset
          if offset > 0 and bosuk > bosuk_esigi:
              if bosuk_uyarisi_gonder(bosuk, offset_guncelleme):
                  print(f"⚠️ Boşluk uyarısı gönderildi: {bosuk} güncelleme kayıp olmuş")
              else:
                  print("⚠️ Boşluk uyarısı gönderilemedi (logda kalır)")

          # TODO 3b: offset yalnızca başarılı işlemde ilerler (istisna → o update'ten önce kalır)
          yeni_offset, islenen, reddedildi, kesinti = updates_isle(updates, offset)

          offset_file.write_text(json.dumps({
              "offset": yeni_offset,
              "guncelleme": datetime.now(timezone.utc).isoformat(),
          }))
          print(f"📝 Offset kaydedildi: {yeni_offset} (işlenen: {islenen}, reddedilen: {reddedildi})")

          if reddedildi > 0:
              print(f"::warning:: {reddedildi} yetkisiz mesaj reddedildi — bot kullanıcı adı sızdırmış olabilir")
          if kesinti:
              print("::error::Bir update işlenemedi; offset güvenli noktada tutuldu, kalan update'ler sonraki koşuda yeniden denenecek")
              sys.exit(1)
          PYEOF

      - name: State dosyasını commit et
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # TODO 3c: offset commit'i her koşuda değil, en az 15 dakikada bir yapılır
          # (git tarihi çöpü azalır — M1). Kontrol shallow-clone'a güvenmez; dosyanın
          # son commit zamanı GitHub API üzerinden okunur. API erişilemezse davranış
          # eski hâline döner (commit yapılır — kayıptan kaçınma).
          SON_TARIH=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=bobi_tv/state/telegram_offset.json&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || echo "")
          if [ -n "$SON_TARIH" ]; then
            SON=$(date -d "$SON_TARIH" +%s)
            SIMDI=$(date +%s)
            FARK=$((SIMDI - SON))
            if [ "$FARK" -lt 900 ]; then
              echo "⏭️ Offset commit atlandı (son commit ${FARK} sn önce < 900 sn) — offset yerel dosyada güncel"
              exit 0
            fi
          fi
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git add -f bobi_tv/state/telegram_offset.json 2>/dev/null || true
          git add -f bobi_tv/state/telegram_menu.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Telegram bot state (offset + menü) [skip ci]" || true
            git push origin main || echo "Push atlandı"
          fi
