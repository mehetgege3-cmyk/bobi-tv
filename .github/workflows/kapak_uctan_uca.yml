name: 🎬 Kapak Uçtan Uca (video metni → Arena → 1. kare)

# AMAÇ: Kullanıcının asıl istediği zinciri KANITLAMAK:
#   video metni → Arena gerçek görsel → indir → videonun 1. karesine yerleştir
# Kanıt: kapak JPG + kapaklı MP4 + kapaklı videonun 1. karesi.
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Test videosu URL (boşsa 6 sn'lik test videosu üretilir)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  kapak:
    name: Kapak üret ve 1. kareye yerleştir
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt imageio-ffmpeg
          python -m playwright install --with-deps chromium

      - name: Uçtan uca kapak
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ARENA_IDLE_DK: "3"
          ARENA_MAKS_DK: "8"
          ARENA_TESHIS: "0"
          RENDER_THREADS: "2"
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p kanit/uretim
          python - << 'PYEOF'
          import os, subprocess
          from pathlib import Path

          kok = Path("kanit/uretim"); kok.mkdir(parents=True, exist_ok=True)
          video = kok / "test.mp4"

          if os.environ.get("VIDEO_URL"):
              import urllib.request
              urllib.request.urlretrieve(os.environ["VIDEO_URL"], video)
              print(f"video indirildi: {video.stat().st_size} bayt", flush=True)
          else:
              import imageio_ffmpeg
              ff = imageio_ffmpeg.get_ffmpeg_exe()
              subprocess.run([ff, "-y", "-loglevel", "error",
                  "-f","lavfi","-i","gradients=s=720x1280:d=6:c0=0x1a2340:c1=0xd97b29:speed=0.1",
                  "-f","lavfi","-i","sine=frequency=220:duration=6",
                  "-c:v","libx264","-preset","veryfast","-crf","26","-pix_fmt","yuv420p",
                  "-c:a","aac","-shortest", str(video)], check=True, timeout=300)
              print(f"test videosu üretildi: {video.stat().st_size} bayt", flush=True)

          # GERÇEK video metni (ilginç bilgi formatı: merak → cevap → sonuç)
          metin = (
              "🧠 Günün Merak Uyandıran Sorusu\n\n"
              "Yuttuğun sakız gerçekten yedi yıl midede kalır mı? "
              "Çoğu insan bunu bir gerçek sanıyor ve çocukluğundan beri korkuyor.\n\n"
              "🔍 Cevabı Biliyor Muydun?\n\n"
              "Mide asidi sakızı çözemiyor, bu doğru. Ama sakız midede beklemiyor; "
              "sindirim sistemi onu kas hareketleriyle bağırsaklara ilerletiyor ve "
              "birkaç gün içinde vücuttan atıyor. Yedi yıl efsanesi 1900'lerin başında "
              "çıkmış bir halk hikâyesi. Sadece çok nadir durumlarda, çok fazla sakız "
              "yiyen kişilerde bağırsakta tıkanma görülebiliyor.\n\n"
              "💡 Şaşırtıcı Sonuç\n\n"
              "Yani sakız midende yedi yıl kalmıyor; sadece sindirilmeden geçip gidiyor. "
              "Bir sonraki merak ettiğin şeyi düşün."
          )

          paket = {
              "dosya_adi": "sakiz_test",
              "final_video": str(video),
              "metin": metin,
              "senaryo": {"kapak_baslik": "Sakız 7 Yıl Kalır mı?", "baslik": "Sakız 7 Yıl Kalır mı?"},
          }

          from modules import kapak_hatti
          sonuc = kapak_hatti.kapak_uret_ve_yerlestir(paket)

          print("=" * 60, flush=True)
          print("SONUÇ:", sonuc, flush=True)
          print("=" * 60, flush=True)

          # Kanıt: kapaklı videonun 1. karesini çıkar
          import imageio_ffmpeg
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          kapakli = sonuc.get("video") or ""
          if kapakli and Path(kapakli).exists():
              subprocess.run([ff, "-y", "-loglevel", "error", "-i", kapakli,
                              "-frames:v", "1", "kanit/uretim/kapakli_ilk_kare.jpg"],
                             check=True, timeout=120)
              print(f"✅ ilk kare çıkarıldı: {Path('kanit/uretim/kapakli_ilk_kare.jpg').stat().st_size} bayt", flush=True)

          # Dosyaları kanit/ altına topla
          import shutil
          for anahtar in ("kapak", "video"):
              yol = sonuc.get(anahtar) or ""
              if yol and Path(yol).exists():
                  shutil.copyfile(yol, f"kanit/uretim/{anahtar}_{Path(yol).name}")
                  print(f"📦 {anahtar}: {Path(yol).name} ({Path(yol).stat().st_size} bayt)", flush=True)

          if sonuc.get("kaynak") != "arena_gorsel":
              print(f"⚠️ KAYNAK: {sonuc.get('kaynak')} (arena_gorsel DEĞİL)", flush=True)
              raise SystemExit(2)
          if not sonuc.get("ilk_kare"):
              print("❌ 1. kareye yerleştirilemedi", flush=True)
              raise SystemExit(3)
          print("🎯 BAŞARILI: Arena görseli üretildi ve 1. kareye yerleştirildi", flush=True)
          PYEOF

      - name: Kanıtı yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kapak-uctan-uca
          path: kanit/uretim/
          if-no-files-found: ignore
