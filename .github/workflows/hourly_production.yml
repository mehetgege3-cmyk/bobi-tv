name: BOBİ TV — Üretim (8 saatte bir) + Kota Takibi

on:
  schedule:
    # HEDEF KADANS: 8 SAATTE BİR (modules/kadans.py → KADANS_DK=480, günde 3).
    # ⚠️ GitHub cron GÜVENİLİR DEĞİLDİR: bu cron yalnızca YEDEKTİR; birincil
    # tetikleyici zincirleme adımıdır (koşu bitince bir sonrakini kendisi açar).
    # 2026-11-11 KARARI: 15 dk kadans kanalı yaktı — 1 saatte silinen videolar
    # Shorts akışına hiç girmiyordu (ortalama 0.8 izlenme). Yeni rejim:
    # 8 saatte bir = günde 3 video, sabit saatler (00/08/16 UTC).
    # GÜNLÜK YÜKLEME TAVANI YOK (kota kaldırıldı) — kadans yalnız zamanlama.
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Zorla çalıştır (kota kontrolü artık yok — zorunlu üretim)'
        required: false
        default: 'false'
  repository_dispatch:
    types: [bobi-tv-produce]

permissions:
  contents: write
  actions: read

# 2026-11-12 DÜZELTME: iptal edilen bir koşu (workflow_dispatch + cancel) concurrency
# grubunun kilidini BIRAKMIYOR → sonraki HER koşu saatlerce 'pending' kalıyordu
# (run 43137635582 hiç başlamadı). Kilit artık koşu kimliğine bağlı: bir tur
# iptal edilse bile sonraki tur anında başlar. Art arda tetiklemeyi cron + zincir
# adımı yönettiği için çift üretim riski yok (zincir, çalışan koşu varsa atlıyor).
concurrency:
  group: hourly-production-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  uret-ve-yayinla:
    name: BOBİ TV v6.4 Pro (Konular Dönüşümlü + 15sn Minimum + 8 saat + Kapak)
    runs-on: ubuntu-latest
    # 8 saatlik slota kadar bekleme + üretim süresi tek job içinde.
    timeout-minutes: 520

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Ayarları state'ten yükle
        run: |
          python3 - << 'PYEOF'
          # TODO 9: bobi_tv/state/ayarlar.json → doğrula → $GITHUB_ENV.
          # SADECE secret olmayan + değiştirilebilir + etkili ayarlar köprüden
          # geçer; secret'lar bu yoldan env'e ASLA yazılmaz. Dosya yoksa/bozuksa
          # katalog varsayılanları uygulanır (toleranslı yükleme).
          import os

          from modules.ayar_deposu import env_satirlari, github_env_yaz

          satirlar = env_satirlari(env=dict(os.environ))
          github_env_yaz(os.environ["GITHUB_ENV"], satirlar)
          for satir in satirlar:
              print(f"⚙️ ayar → env: {satir.split('=', 1)[0]}")
          if not satirlar:
              print("ℹ️ ayar köprüsü boş — katalog varsayılanları etkin")
          PYEOF

      - name: Tetikleyici parametrelerini çöz
        id: tetik
        run: |
          python - << 'PYEOF'
          # workflow_dispatch inputs ve repository_dispatch client_payload tek noktada
          # birleştirilir; schedule'da ikisi de boştur (force=false).
          import os

          ham = str(os.environ.get("TETIK_FORCE") or "").strip().lower()
          force = "true" if ham in ("true", "1", "yes") else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"force={force}\n")
          print(f"Tetikleyici force={force}")
          # TODO 12: render testi payload'ı → env. Köprüden SONRA yazıldığı için
          # payload, state değerini geçersiz kılar (koşul bazlı geçici zorlama).
          ham_yukleme = str(os.environ.get("TETIK_YUKLEME_ATLA") or "").strip().lower()
          if ham_yukleme in ("1", "true", "yes"):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write("YUKLEME_ATLA=1\n")
              print("Render testi modu: YUKLEME_ATLA=1 (client_payload)")
          PYEOF
        env:
          TETIK_FORCE: ${{ github.event.inputs.force || github.event.client_payload.force || 'false' }}
          TETIK_YUKLEME_ATLA: ${{ github.event.client_payload.yukleme_atla || '' }}

      - name: Son koşudan bu yana geçen süreyi logla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - << 'PYEOF'
          # Gözlemlenebilirlik: dış tetikleyicinin gerçek sıklığını ölçer.
          # Kozmetik adım — hata asla koşuyu düşürmez.
          import json
          import subprocess
          from datetime import datetime, timezone

          try:
              out = subprocess.run(
                  [
                      "gh", "run", "list",
                      "--workflow", "hourly_production.yml",
                      "--status", "completed",
                      "--limit", "1",
                      "--json", "createdAt,runNumber",
                  ],
                  capture_output=True, text=True, timeout=30, check=False,
              )
              kayitlar = json.loads(out.stdout or "[]")
              if not kayitlar:
                  print("Önceki tamamlanmış koşu yok — bu ilk koşu.")
              else:
                  onceki = datetime.fromisoformat(
                      kayitlar[0]["createdAt"].replace("Z", "+00:00")
                  )
                  fark_dk = (datetime.now(timezone.utc) - onceki).total_seconds() / 60
                  print(
                      f"⏱️ Son koşudan bu yana {fark_dk:.1f} dakika geçti "
                      f"(önceki koşu #{kayitlar[0].get('runNumber')})"
                  )
          except Exception as e:  # noqa: BLE001 — gözlemlenebilirlik, koşuyu etkilemez
              print(f"Süre ölçümü atlandı (koşuyu etkilemez): {e}")
          PYEOF

      - name: Python kur + pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 1/4 · Sistem araçları (FFmpeg + fontlar)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg \
            espeak-ng \
            fonts-dejavu-core \
            fonts-liberation2 \
            libass9

      - name: 2/4 · Python paketleri + Chromium (Arena için)
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      # =================================================================
      # KOTA ADIMI KALDIRILDI — KULLANICI KARARI (2026-11-11):
      # "Kota 6 istemiyorum, kotayı kaldır; hem Telegram'da hem GitHub'ta
      #  her yerden kaldır."
      #
      # Eskiden burada "Kota durumunu kontrol et" adımı vardı: günlük yükleme
      # tavanını (6) hesaplar, doluysa videoları stoğa alırdı. Artık:
      #   • Günlük yükleme tavanı YOK.
      #   • Üretim ile yükleme arasında kota kapısı YOK.
      #   • Tek engel YouTube'un GERÇEK API hatasıdır (403 quotaExceeded);
      #     o durumda video stoğa yazılır ve kota açılınca (UTC 00:00) yüklenir.
      # Kaldırılan adımın hiçbir çıktısına başka adım bağlı değildir
      # (pipeline/klasör koşulları render testine ve force bayrağına bakar).
      # =================================================================

      - name: Klasör yapısını hazırla
        # Üretimi durduran kota kapısı YOK; force bayrağı klasör hazırlığını
        # garanti eder.
        if: steps.rtest.outputs.render_test != '1' || steps.tetik.outputs.force == 'true'
        run: |
          mkdir -p bobi_tv/{queue,assets/{fonts,sfx},production/{scripts/arena,tts,render},output,archive/published,logs,config}

      # 2026-11-11 (A1): KANCA MOTORU KENDİ TESTİ — üretimden önce.
      # Neden: kanca motoru 3 video/gün ile çalışıyor; sessizce bozulursa
      # (ör. boş metin, rotasyon hatası) fark etmek günler sürer. Bu adım
      # motorun sözleşmesini her koşuda 1 saniyede doğrular ve ASLA üretimi
      # durdurmaz (continue-on-error) — sadece Telegram/log uyarısı verir.
      - name: Kanca motoru sağlık kontrolü
        if: always()
        continue-on-error: true
        run: |
          python3 - << 'PYEOF'
          from modules.senaryo_v7.kanca_motoru import (
              paket_kancasini_uygula, siradaki_form,
          )

          paket = {"senaryo": {"hook_ust_bant": "Patron toplantıda maaşları açıkladı",
                               "tts_metinleri": ["Patron toplantıda maaşları açıkladı"]}}
          ozet = paket_kancasini_uygula(paket, video_no=0)
          assert ozet["uygulandi"], f"kanca uygulanamadı: {ozet}"
          assert ozet["puan"] >= 75, f"kanca puanı düşük: {ozet['puan']}"
          assert paket["senaryo"]["kanca_formu"], "form yazılmadı"
          assert paket["senaryo"]["hook_ust_bant"] == ozet["metin"], "üst bant yazılmadı"
          formlar = {siradaki_form(i) for i in range(4)}
          assert len(formlar) == 4, f"rotasyon bozuk: {formlar}"
          print(f"✅ Kanca motoru sağlıklı: {ozet['form']} {ozet['puan']}/100 → {ozet['metin']}")
          PYEOF

      - name: 3/4 · Pipeline'ı çalıştır — seslendir · render · YouTube'a yükle
        if: steps.rtest.outputs.render_test != '1'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # PAT yoksa/yazma başarısızsa hiçbir şey bozulmaz, mevcut çerez kalır.
          GH_PAT: ${{ secrets.GH_PAT }}
          # `gorsel_prompt` ile AI arka plan üretilir; yoksa 1. kare adayları
          # kullanılır (akış durmaz).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Gemini WEB oturum çerezi — kapak görseli (API anahtarı değil).
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Ayar sabitleri (GUNLUK_HEDEF/GUNLUK_MAKS/MOD/OTOMATIK_SIL_AKTIF)
          # BURADAN KALDIRILDI (TODO 9): tek doğruluk kaynağı bobi_tv/state/
          # ayarlar.json → 'Ayarları state'ten yükle' adımı $GITHUB_ENV'e yazar.
          # Secret satırları köprüye girmez; burada kalır.
        run: |
          python main_pipeline.py

      - name: Tek kullanımlık force bayrağını tüket
        if: always()
        run: |
          python3 - << 'PYEOF'
          # force tek kullanımlıktır (TODO 1): bu koşu tüketti, state'i 0'a çeker.
          # Değişiklik 'Arşivi ve kuyruk durumunu commit et' adımıyla push edilir.
          from modules.ayar_deposu import force_sifirla

          if force_sifirla():
              print("🔁 force=1 tüketildi → state'te 0'a çekildi")
          else:
              print("ℹ️ force bayrağı 1 değildi — işlem yok")
          PYEOF

      - name: Üretilen Pro MP4 ve 1. Kare Kapağı Artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bobi-tv-v6-pro-video-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 5
          path: |
            bobi_tv/output/*.mp4
            bobi_tv/output/*_thumb.jpg
            bobi_tv/logs/quality/*.jsonl

      - name: Günlük kalite istatistiklerini göster
        if: always()
        run: |
          python - << 'PYEOF'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          tarih = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          log_dosya = Path(f"bobi_tv/logs/quality/{tarih}.jsonl")

          if not log_dosya.exists():
              print("Bugün için kalite kaydı yok.")
          else:
              kayıtlar = []
              with open(log_dosya, "r", encoding="utf-8") as f:
                  for satir in f:
                      try:
                          kayıtlar.append(json.loads(satir))
                      except Exception:
                          continue

              if not kayıtlar:
                  print("Bugün için kalite kaydı yok.")
              else:
                  toplam = len(kayıtlar)
                  puanlar = [k["toplam_puan"] for k in kayıtlar]
                  gecen = sum(1 for k in kayıtlar if k["gecti"])

                  print(f"\n📊 GÜNLÜK KALİTE RAPORU ({tarih})")
                  print(f"{'='*40}")
                  print(f"Toplam video: {toplam}")
                  print(f"Ortalama puan: {round(sum(puanlar)/toplam, 1) if toplam > 0 else 0}")
                  print(f"Geçen: {gecen}/{toplam} ({round(gecen/toplam*100) if toplam > 0 else 0}%)")
                  print(f"Min puan: {min(puanlar) if puanlar else 0}")
                  print(f"Max puan: {max(puanlar) if puanlar else 0}")
          PYEOF

      - name: Render testi sonucu bildir (yükleme yok)
        if: always() && env.YUKLEME_ATLA == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'PYEOF'
          # TODO 12: 'video üretiliyor mu?' sorusunun kotasız ve yayınsız cevabı.
          # Sonuç mesajı: süre · çıktı boyutu · QC sonucu · 'yükleme yapılmadı'.
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          def _mp4_boyutu() -> int:
              cikti = Path("bobi_tv/output")
              if not cikti.exists():
                  return 0
              return sum(f.stat().st_size for f in cikti.glob("*.mp4") if f.is_file())

          def _qc_ozeti() -> str:
              tarih = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              yolu = Path(f"bobi_tv/logs/quality/{tarih}.jsonl")
              if not yolu.exists():
                  return "bilgi yok"
              try:
                  kayitlar = [
                      json.loads(s)
                      for s in yolu.read_text(encoding="utf-8").splitlines()
                      if s.strip()
                  ]
              except Exception:
                  return "bilgi yok"
              if not kayitlar:
                  return "bilgi yok"
              puanlar = [int(k.get("toplam_puan", 0)) for k in kayitlar]
              gecen = sum(1 for k in kayitlar if k.get("gecti"))
              return f"ortalama {round(sum(puanlar) / len(puanlar))}/100 · {gecen}/{len(kayitlar)} geçti"

          def _sure_ozeti() -> str:
              tarih = datetime.now(timezone.utc).strftime("%Y-%m-%d")
              yolu = Path(f"bobi_tv/logs/{tarih}.log")
              if not yolu.exists():
                  return "bilinmiyor"
              try:
                  for satir in reversed(yolu.read_text(encoding="utf-8").splitlines()):
                      if "=== Tamamlandı" in satir and "(" in satir and "sn)" in satir:
                          return satir.split("(")[1].split(")")[0]
              except Exception:
                  pass
              return "bilinmiyor"

          metin = (
              "🧪 <b>Render testi tamamlandı</b>\n"
              f"⏱️ Süre: {_sure_ozeti()}\n"
              f"📦 Çıktı: {_mp4_boyutu() / 1048576:.1f} MB MP4\n"
              f"🎯 QC: {_qc_ozeti()}\n"
              "✅ YouTube'a yükleme yapılmadı (test koşusu — canlı kanal etkilenmedi)."
          )
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if token and chat_id:
              try:
                  resp = requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json={"chat_id": chat_id, "text": metin, "parse_mode": "HTML"},
                      timeout=10,
                  )
                  print(f"Render testi bildirimi HTTP {resp.status_code}")
              except Exception as e:
                  print(f"Bildirim hatası (koşuyu etkilemez): {e}")
          else:
              print(metin)
          PYEOF

      - name: 4/4 · Arşivi ve kuyruk durumunu commit et
        if: always()
        run: |
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"

          # Değişiklikleri göster (debug)
          echo "=== Değişen dosyalar ==="
          git status --short || true

          # Arşiv ve state dosyalarını ekle
          # 2026-11-11: KALİTE GÜNLÜĞÜ de commit edilir. Önceden yalnız artifact'a
          # gidiyordu → panel/rapor "kalite: veri yok" diyordu (kullanıcının
          # gördüğü boş kalite bloğu). Artık repo'da: panel gerçek puanı okur.
          git add -f bobi_tv/archive/ bobi_tv/state/ bobi_tv/logs/quality/ bobi_tv/production/scripts/arena/ 2>/dev/null || true

          # TODO 4a: kuyruğu DİZİN pathspec'i ile ekle — kabuk glob'u yalnızca VAR
          # OLAN dosyaları genişletir; kuyrukta başka dosya dururken tüketilen
          # kaydın silmesi stage'e girmiyordu (silme commit'lenmez → bayat kuyruk).
          # Dizin pathspec'i eklemeleri de silmeleri de HER ZAMAN alır (-f: .gitignore override).
          git add -f bobi_tv/queue/ 2>/dev/null || true

          # Commit ve push
          if ! git diff --staged --quiet; then
            git commit -m "📺 BOBİ TV v6.4 arşiv/kuyruk/kota [$(date +%Y-%m-%dT%H:%M)] [skip ci]" || true
            git pull --rebase origin main || git pull origin main || true
            # Arşiv push'u SESSİZCE YUTULMAZ: video kaydı (videos.json/kuyruk/kota)
            # push edilemezse bir sonraki koşu aynı videoyu yeniden üretir veya
            # kaydı kaybeder. Kırmızı tik, sessiz yeşilden iyidir.
            if ! git push origin main; then
              echo "::error::Arşiv push başarısız — video kaydı/kuyruk/kota kaybolabilir"
              exit 1
            fi
            echo "✅ Arşiv push tamamlandı"
          else
            echo "ℹ️ Değişiklik yok, commit atlanıyor"
          fi

      - name: Hata bildirimi
        # Kota kaldırıldı → "kota doldu" istisnası yok; her hatada bildir.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests, sys
          token = os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID','')
          saat = __import__('datetime').datetime.utcnow().strftime('%H:%M')
          if token and chat_id:
              try:
                  resp = requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                    json={'chat_id': chat_id,
                          'text': f'🔴 <b>BOBİ TV v6.2 ({saat} UTC) başarısız</b>\nhttps://github.com/mehetgege3-cmyk/bobi-tv/actions',
                          'parse_mode': 'HTML'}, timeout=10)
                  if resp.status_code >= 400:
                      print(f'Telegram HTTP {resp.status_code}: {resp.text}', file=sys.stderr)
                      sys.exit(1)
              except Exception as e:
                  print(f'Telegram hatası: {e}', file=sys.stderr)
                  sys.exit(1)
          "

      # =====================================================================
      # 8 SAAT KADANSINI ZİNCİRLE (kullanıcı kararı 2026-11-11:
      # "8 saatte bir video üretilip yüklensin" — günde 3).
      #
      # NEDEN: GitHub'ın kendi cron'u GÜVENİLMEZ. Ölçüm (2026-11-10):
      # '*/15' yazılı olduğu halde fiilen günde 2-3 koşu oldu
      # (13:06, 13:17, 16:55, 19:41, 22:07). Cron tek başına 96 koşu/gün
      # üretmiyor; bu yüzden her koşu bir SONRAKİNİ kendisi tetikler.
      #
      # GÜVENLİK / DÖNGÜ KIRICI:
      #   • Her zaman `always()` çalışır — üretim hatası olsa bile kadans durmaz.
      #   • 30 sn bekler; sonra "son 12 dk içinde bu workflow başka bir
      #     tetikleme ile çalıştı mı" kontrol edilir. Çalıştıysa ÇİFT tetikleme
      #     olur, atlanır (GitHub cron'u araya girerse kuyruk şişmez).
      #   • Zamanlanmış koşular arasında en az 8 dk bırakılır (6 dk üretim
      #     süresi + pay).
      #   • GH_PAT yoksa adım sessizce geçer (cron yine çalışır).
      # =====================================================================

  # =====================================================================
  # 8 SAAT KADANSI — UYUYAN JOB (2026-11-11 düzeltmesi)
  #
  # ESKİ HATA: zincirleme adımı ÜRETİM job'unun İÇİNDE uyuyordu
  # (`time.sleep(~8 saat)`). Job bu süre boyunca `in_progress` kalıyordu ve
  # `concurrency: hourly-production` yüzünden yeni koşular SAATLERCE
  # `pending` bekliyordu. Kanıt: run 42975301955 üretimini 07:00'de bitirdi
  # ama iş 15:00'e kadar "in_progress" durdu; 09:35'te tetiklenen yeni koşu
  # 40+ dk `pending` kaldı.
  #
  # YENİ: uyku AYRI bir job'da (`bekle-ve-zincirle`), kendi concurrency grubunda.
  # GH_PAT varsa `gh workflow run` gecikmeli tetikler (uyku yok); yoksa GitHub
  # cron'u (0 */8) devralır. Üretim job'u bittiği an kuyruk SERBEST kalır.
  # =====================================================================
  bekle-ve-zincirle:
    name: Sonraki 8 saat turunu tetikle (üretimi bloklamaz)
    needs: uret-ve-yayinla
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: zincir-bekleme
      cancel-in-progress: true
    timeout-minutes: 540
    steps:
      - name: Slotu bekle ve zincirle (tetikle)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          KADANS_DK: "480"
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ.get("GH_PAT", "").strip()
          if not token:
              print("zincir: GH_PAT yok — tetikleme yok, GitHub cron'u (0 */8) devralır")
              raise SystemExit(0)

          kadans_dk = int(os.environ.get("KADANS_DK", "480") or 480)
          repo = "mehetgege3-cmyk/bobi-tv"
          api = f"https://api.github.com/repos/{repo}/actions"
          basliklar = {"Authorization": f"token {token}",
                       "Accept": "application/vnd.github+json"}

          def istek(url, veri=None, yontem="GET"):
              r = urllib.request.Request(
                  url,
                  data=json.dumps(veri).encode() if veri else None,
                  headers=basliklar, method=yontem)
              with urllib.request.urlopen(r, timeout=30) as c:
                  govde = c.read()
                  return json.loads(govde) if govde else {}

          def kosulari_al():
              try:
                  return istek(f"{api}/workflows/hourly_production.yml/runs?per_page=10")["workflow_runs"]
              except Exception as e:
                  print(f"zincir: koşular okunamadı ({e})")
                  return []

          def zaman(m):
              return datetime.fromisoformat(m.replace("Z", "+00:00"))

          kosular = kosulari_al()
          if kosular:
              sonraki = zaman(kosular[0]["created_at"]) + timedelta(minutes=kadans_dk)
              bekle = (sonraki - datetime.now(timezone.utc)).total_seconds()
              if bekle > 0:
                  bekle = min(bekle, kadans_dk * 60)
                  print(f"zincir: slot {sonraki:%H:%M} UTC — {bekle/60:.0f} dk bekleniyor "
                        "(üretim job'u ETKİLENMEZ, kuyruk serbest)")
                  time.sleep(bekle)
                  for _ in range(int(bekle // 300)):
                      print("zincir: hâlâ bekliyor…", flush=True)
                      time.sleep(0)

          kosular = kosulari_al()
          # KENDİ koşumuz listede "completed/in_progress" görünebilir (bu job
          # hâlâ uyurken üretim job'u bitmişse). Kendi run_id'mizi atlamazsak
          # zincir HER turda "çalışan koşu var" deyip kendini atlıyordu →
          # 8 saatlik zincir kırıktı, üretimi yalnız cron kurtarıyordu.
          kendi = str(os.environ.get("GITHUB_RUN_ID") or "")
          for k in kosular:
              if str(k.get("id")) == kendi:
                  continue
              if k["status"] in ("queued", "in_progress"):
                  print(f"zincir: çalışan koşu var (#{k['run_number']}) — atlandı")
                  raise SystemExit(0)

          try:
              istek(f"{api}/workflows/hourly_production.yml/dispatches",
                    {"ref": "main", "inputs": {"force": "false"}}, "POST")
              print("zincir: ✅ bir sonraki tur tetiklendi")
          except urllib.error.HTTPError as e:
              print(f"zincir: tetikleme hatası HTTP {e.code} — {e.read()[:200]!r}")
          except Exception as e:
              print(f"zincir: tetikleme hatası {e}")
          PY
