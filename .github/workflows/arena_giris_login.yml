name: "🔐 Arena Giriş + Çerez Yenile (e-posta/şifre)"

# AMAÇ: ARENA_COOKIES_JSON süresi dolduğunda TEK TIKLA çerez yenilemek.
# Kullanıcı LMARENA_EMAIL + LMARENA_PASSWORD secret'larını ekledi (2026-11-12).
# Bu workflow: Arena'ya e-posta/şifre ile girer → çerezleri alır →
# ARENA_COOKIES_JSON secret'ını GÜNCELLER (GH_PAT ile) → doğrulama koşusu yapar.

on:
  workflow_dispatch:
  # Çerez ölü kaldığında otomatik de denesin (günde 2 kez)
  schedule:
    - cron: "0 4,16 * * *"

permissions:
  contents: read

jobs:
  giris:
    name: Arena'ya gir ve çerezi tazele
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Giriş yap ve çerezi secret'a yaz
        env:
          LMARENA_EMAIL: ${{ secrets.LMARENA_EMAIL }}
          LMARENA_PASSWORD: ${{ secrets.LMARENA_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          PYTHONPATH=. python - <<'PYEOF'
          import sys
          from modules import arena_giris

          if not arena_giris.kimlik_var_mi():
              print("❌ LMARENA_EMAIL / LMARENA_PASSWORD tanımlı değil")
              sys.exit(2)

          ok = arena_giris.giris_yap_ve_secret_guncelle()
          if ok:
              print("✅ ARENA_COOKIES_JSON güncellendi")
              sys.exit(0)
          print("❌ Giriş başarısız — mevcut çerez korundu (üretim video karesi yedeğine düşer)")
          sys.exit(1)
          PYEOF

      - name: Sonucu iş özetine yaz
        if: always()
        run: |
          {
            echo "### Arena giriş denemesi"
            echo "- E-posta secret'ı: ${{ secrets.LMARENA_EMAIL != '' && 'var' || 'YOK' }}"
            echo "- Log'daki 'Giriş' satırlarına bak (şifre asla yazılmaz)."
          } >> "$GITHUB_STEP_SUMMARY"
