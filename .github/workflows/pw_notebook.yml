name: Playwright NotebookLM

# NİÇİN: batchexecute elle çağrıldığında null dönüyor. Defter açma ve not
# ekleme RPC'leri HAR'da yok. Gerçek tarayıcıyla adım adım deniyoruz,
# her adımda ekran görüntüsü alıyoruz.
on:
  workflow_dispatch:

jobs:
  pw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright kur
        run: |
          pip install --quiet playwright
          python -m playwright install chromium --with-deps

      - name: Tarayıcıda dene
        env:
          NOTEBOOK_GOOGLE: ${{ secrets.NOTEBOOK_GOOGLE }}
        run: python3 tools/pw_notebook.py

      - name: Raporu commit'le
        if: always()
        run: |
          git config user.name "bobi-agent"
          git config user.email "agent@bobi.tv"
          git add docs/pw || true
          git diff --staged --quiet || git commit -m "docs: playwright notebook denemesi"
          git push origin HEAD:main || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pw-notebook
          path: docs/pw/
