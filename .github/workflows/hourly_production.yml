name: BOBİ TV v6.4 PRO — Saatlik Üretim + Kota Takibi

on:
  schedule:
    # Gerçekçi saatlik üretim (GitHub'da 15 dk garanti edilemez)
    - cron: '*/10 * * * *'  # Her 10 dakika (GitHub cron güvenilir DEĞİLDİR; günlük kota kapısı sınırı korur)
  workflow_dispatch:
    inputs:
      force:
        description: 'Zorla çalıştır (kota kontrolünü atla)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

concurrency:
  group: hourly-production
  cancel-in-progress: false

jobs:
  uret-ve-yayinla:
    name: BOBİ TV v6.3 Pro (Konular Dönüşümlü + 15sn Minimum + 15dk + Kapak)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Python kur + pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Sistem bağımlılıklarını kur (FFmpeg & Fontlar)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg \
            espeak-ng \
            fonts-dejavu-core \
            fonts-liberation2 \
            libass9

      - name: Python bağımlılıklarını ve Playwright Chromium'u kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Kota durumunu kontrol et
        id: kota
        run: |
          python - << 'PYEOF'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          state_file = Path("bobi_tv/state/youtube_quota.json")
          arsiv = Path("bobi_tv/archive/videos.json")

          # Kota state kontrolü
          kota_doldu = False
          if state_file.exists():
              try:
                  state = json.loads(state_file.read_text(encoding="utf-8"))
                  guncelleme = state.get("guncelleme", "")
                  if guncelleme and state.get("doldu"):
                      guncel_zaman = datetime.fromisoformat(guncelleme.replace("Z", "+00:00"))
                      gecen_saat = (datetime.now(timezone.utc) - guncel_zaman).total_seconds() / 3600
                      if gecen_saat < 24:
                          kota_doldu = True
                          print(f"⚠️ Kota dolu, {24 - gecen_saat:.1f} saat kaldı")
              except Exception:
                  pass

          # Bugünkü video sayısı
          bugun = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          hedef = 24  # Saatlik üretim için 24 video/gün
          bugunki = 0
          if arsiv.exists():
              try:
                  kayitlar = json.loads(arsiv.read_text(encoding="utf-8"))
                  bugunki = sum(1 for k in kayitlar if k.get("tarih","")[:10] == bugun)
              except Exception:
                  pass

          kalan = max(0, hedef - bugunki)
          devam = "false" if kota_doldu else ("true" if kalan > 0 else "false")

          print(f"Bugün: {bugunki}/{hedef} | Kalan: {kalan} | Kota: {'DOLU' if kota_doldu else 'BOŞ'} | Devam: {devam}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"bugunki={bugunki}\n")
              f.write(f"kalan={kalan}\n")
              f.write(f"kota_doldu={'true' if kota_doldu else 'false'}\n")
              f.write(f"devam={devam}\n")
          PYEOF


      - name: Kota doluysa bildir ve durdur
        if: steps.kota.outputs.kota_doldu == 'true' && github.event.inputs.force != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests, sys
          token = os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID','')
          if token and chat_id:
              try:
                  requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                    json={'chat_id': chat_id,
                          'text': '🚫 <b>YouTube kota dolu</b> — bu çalıştırmada üretim atlandı. Kota UTC 00:00\'da sıfırlanır.',
                          'parse_mode': 'HTML'}, timeout=10)
              except Exception as e:
                  print(f'Telegram bildirim hatası: {e}', file=sys.stderr)
          print('::warning::Kota dolu, üretim atlandı (bildirim gönderildi)')
          sys.exit(1)
          "

      - name: Klasör yapısını hazırla
        if: steps.kota.outputs.devam == 'true' || github.event.inputs.force == 'true'
        run: |
          mkdir -p bobi_tv/{queue,assets/{fonts,sfx},production/{scripts/arena,tts,render},output,archive/published,logs,config}

      - name: BOBİ TV v6.4 Pro Pipeline'ı çalıştır
        if: steps.kota.outputs.devam == 'true' || github.event.inputs.force == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GUNLUK_HEDEF: '1'
          GUNLUK_MAKS: '24'
          MOD: 'isindirma_saatlik'
          OTOMATIK_SIL_AKTIF: '1'
          # Silme eşiği TEK KAYNAK: main_pipeline.py (1440dk/100); burada override edilmez.
        run: |
          python main_pipeline.py

      - name: Üretilen Pro MP4 ve 1. Kare Kapağı Artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bobi-tv-v6-pro-video-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 5
          path: |
            bobi_tv/output/*.mp4
            bobi_tv/output/*_thumb.jpg
            bobi_tv/logs/quality/*.jsonl

      - name: Günlük kalite istatistiklerini göster
        if: always()
        run: |
          python - << 'PYEOF'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          tarih = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          log_dosya = Path(f"bobi_tv/logs/quality/{tarih}.jsonl")

          if not log_dosya.exists():
              print("Bugün için kalite kaydı yok.")
          else:
              kayıtlar = []
              with open(log_dosya, "r", encoding="utf-8") as f:
                  for satir in f:
                      try:
                          kayıtlar.append(json.loads(satir))
                      except Exception:
                          continue

              if not kayıtlar:
                  print("Bugün için kalite kaydı yok.")
              else:
                  toplam = len(kayıtlar)
                  puanlar = [k["toplam_puan"] for k in kayıtlar]
                  gecen = sum(1 for k in kayıtlar if k["gecti"])

                  print(f"\n📊 GÜNLÜK KALİTE RAPORU ({tarih})")
                  print(f"{'='*40}")
                  print(f"Toplam video: {toplam}")
                  print(f"Ortalama puan: {round(sum(puanlar)/toplam, 1) if toplam > 0 else 0}")
                  print(f"Geçen: {gecen}/{toplam} ({round(gecen/toplam*100) if toplam > 0 else 0}%)")
                  print(f"Min puan: {min(puanlar) if puanlar else 0}")
                  print(f"Max puan: {max(puanlar) if puanlar else 0}")
          PYEOF

      - name: Arşivi ve kuyruk durumunu commit et
        if: always()
        run: |
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"

          # Değişiklikleri göster (debug)
          echo "=== Değişen dosyalar ==="
          git status --short || true

          # Arşiv ve state dosyalarını ekle
          git add -f bobi_tv/archive/ bobi_tv/state/ bobi_tv/production/scripts/arena/ 2>/dev/null || true

          # Kuyruk JSON'larını zorla ekle (.gitignore override)
          git add -f bobi_tv/queue/*.json 2>/dev/null || true

          # Commit ve push
          if ! git diff --staged --quiet; then
            git commit -m "📺 BOBİ TV v6.4 arşiv/kuyruk/kota [$(date +%Y-%m-%dT%H:%M)] [skip ci]" || true
            git pull --rebase origin main || git pull origin main || true
            git push origin main || echo "Push başarısız (devam ediliyor)"
            echo "✅ Arşiv push tamamlandı"
          else
            echo "ℹ️ Değişiklik yok, commit atlanıyor"
          fi

      - name: Hata bildirimi
        if: failure() && steps.kota.outputs.kota_doldu != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests, sys
          token = os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID','')
          saat = __import__('datetime').datetime.utcnow().strftime('%H:%M')
          if token and chat_id:
              try:
                  resp = requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                    json={'chat_id': chat_id,
                          'text': f'🔴 <b>BOBİ TV v6.2 ({saat} UTC) başarısız</b>\nhttps://github.com/mehetgege3-cmyk/bobi-tv/actions',
                          'parse_mode': 'HTML'}, timeout=10)
                  if resp.status_code >= 400:
                      print(f'Telegram HTTP {resp.status_code}: {resp.text}', file=sys.stderr)
                      sys.exit(1)
              except Exception as e:
                  print(f'Telegram hatası: {e}', file=sys.stderr)
                  sys.exit(1)
          "
