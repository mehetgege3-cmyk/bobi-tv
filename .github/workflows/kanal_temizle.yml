name: BOBİ TV — Kanal Temizle

on:
  workflow_dispatch: {}

jobs:
  temizle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-auth google-auth-httplib2 google-api-python-client -q

      - name: Tüm videoları sil
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import json, requests, os, glob
          from pathlib import Path

          # Token yenile
          token_raw = os.environ.get("YOUTUBE_TOKEN", "")
          if not token_raw:
              print("YOUTUBE_TOKEN yok")
              exit(1)

          token_data = json.loads(token_raw)

          resp = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id": token_data["client_id"],
              "client_secret": token_data["client_secret"],
              "refresh_token": token_data["refresh_token"],
              "grant_type": "refresh_token"
          }, timeout=15)

          if resp.status_code != 200:
              print(f"Token yenileme hatası: {resp.text}")
              exit(1)

          access_token = resp.json()["access_token"]
          headers = {"Authorization": f"Bearer {access_token}"}

          # Arşivdeki video ID'lerini topla
          video_ids = []
          files = glob.glob("bobi_tv/archive/published/*.json")
          for f in files:
              d = json.loads(Path(f).read_text())
              vid = d.get("video_id")
              if vid:
                  video_ids.append((vid, d.get("baslik", "?")[:40], f))

          print(f"Silinecek {len(video_ids)} video")

          silinen = 0
          for vid, baslik, arsiv_f in video_ids:
              r = requests.delete(
                  f"https://www.googleapis.com/youtube/v3/videos?id={vid}",
                  headers=headers, timeout=15
              )
              if r.status_code in (204, 200):
                  print(f"  ✅ Silindi: {vid} — {baslik}")
                  Path(arsiv_f).unlink(missing_ok=True)
                  silinen += 1
              elif r.status_code == 404:
                  print(f"  ℹ️ Zaten yok: {vid}")
                  Path(arsiv_f).unlink(missing_ok=True)
              else:
                  print(f"  ❌ Silinemedi: {vid} — {r.status_code} {r.text[:100]}")

          # Arşivi sıfırla
          Path("bobi_tv/archive/videos.json").write_text("[]")

          print(f"\nToplam silinen: {silinen}/{len(video_ids)}")

          # Telegram bildir
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if token and chat_id:
              requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                json={"chat_id": chat_id,
                      "text": f"🗑️ <b>BOBİ TV Kanal Temizlendi</b>\n{silinen} video silindi. Arena AI ile yeniden başlıyor!",
                      "parse_mode": "HTML"}, timeout=10)
          PYEOF

      - name: Arşivi commit et
        run: |
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git add bobi_tv/archive/ || true
          git diff --staged --quiet || git commit -m "🗑️ Kanal temizlendi — Arena AI ile yeniden başlıyor [skip ci]"
          git push || true
