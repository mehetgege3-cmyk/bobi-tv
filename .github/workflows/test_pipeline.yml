name: BOBİ TV v6.0 — Uçtan Uca Kalite Testi

on:
  workflow_dispatch:
    inputs:
      yukle:
        description: 'YouTube yüklemesi de yapılsın mı? (0 = sadece render testi, 1 = yükle)'
        required: false
        default: '0'

jobs:
  test:
    name: v6.0 Pro Render & QC Testi
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg espeak-ng fonts-dejavu-core fonts-liberation2 libass9

      - name: Python bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pipeline testini çalıştır
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          GUNLUK_HEDEF: '1'
          YUKLEME_ATLA: ${{ github.event.inputs.yukle == '1' && '0' || '1' }}
        run: |
          python main_pipeline.py

      - name: Test Videosunu Artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bobi-tv-v6-test-video-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 5
          path: |
            bobi_tv/output/*.mp4
            bobi_tv/output/*_thumb.jpg
