name: 🖼️ Mevcut Kapakları Yenile (Gemini)

# KULLANICI (2026-11-13): "Tüm mevcut videoların kapak fotoğrafını güncelle
# gemini ile."
#
# NEDEN GEREKLİ: Kapak hattı `_kapakli.mp4` üretiyordu ama `paket["final_video"]`
# güncellenmediği için YouTube'a KAPAKSIZ video gitti; ayrıca kapak 33 ms
# görünüyordu. Bu workflow GEÇMİŞ videoların kapaklarını `thumbnails.set` ile
# düzeltir (video yeniden yüklenmez).
#
# ÖNEMLİ: YouTube Shorts rafındaki `oar2.jpg` görselini API DEĞİŞTİREMEZ.
# Bu workflow `maxresdefault`/`hqdefault` kapağını düzeltir (kanal listesi,
# arama, paylaşım). Ayrıntı: docs/KAPAK_TESHIS.md

on:
  workflow_dispatch:
    inputs:
      azami:
        description: 'Bu koşuda işlenecek video sayısı (1-10)'
        required: true
        default: '3'
      kuru:
        description: 'Sadece üret, yükleme yapma (1 = kuru)'
        required: false
        default: '0'
  schedule:
    # Günde 3 video — YouTube kota dostu, 60 video ~20 günde biter
    - cron: '15 9 * * *'

permissions:
  contents: read

jobs:
  yenile:
    name: Kapakları yenile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q requests pillow

      - name: Kapakları üret ve yükle
        env:
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PYTHONPATH: .
        run: |
          AZAMI="${{ inputs.azami }}"
          KURU="${{ inputs.kuru }}"
          [ -z "$AZAMI" ] && AZAMI=3
          [ -z "$KURU" ] && KURU=0
          ARGS="--azami $AZAMI"
          [ "$KURU" = "1" ] && ARGS="$ARGS --kuru"
          echo "çalıştırılıyor: $ARGS"
          python tools/kapak_yenile.py $ARGS

      - name: Üretilen kapakları sakla (kanıt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeni-kapaklar
          path: /tmp/yeni_kapaklar/*.jpg
          if-no-files-found: ignore
          retention-days: 7
