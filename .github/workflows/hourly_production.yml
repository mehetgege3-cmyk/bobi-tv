name: BOBİ TV v6.3 PRO — Dönen Konular, 15sn+ ve Her 15 Dakikada Üretim

on:
  schedule:
    # Kanal ısındırma modu: Her 15 dakikada 1 video üretimi + 1 saatte <100 izlenenleri otomatik temizleme
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Zorla çalıştır (günlük limit kontrolünü atla)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

concurrency:
  group: hourly-production
  cancel-in-progress: false

jobs:
  uret-ve-yayinla:
    name: BOBİ TV v6.3 Pro (Konular Dönüşümlü + 15sn Minimum + 15dk + Kapak)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Python kur + pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Sistem bağımlılıklarını kur (FFmpeg & Fontlar)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg \
            espeak-ng \
            fonts-dejavu-core \
            fonts-liberation2 \
            libass9

      - name: Python bağımlılıklarını ve Playwright Chromium'u kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Günlük video sayısını kontrol et (96 video/gün — 15dk ısındırma)
        id: kapasite
        run: |
          python - << 'PYEOF'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          arsiv = Path("bobi_tv/archive/videos.json")
          bugun = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          hedef = 96

          bugunki = 0
          if arsiv.exists():
              try:
                  kayitlar = json.loads(arsiv.read_text(encoding="utf-8"))
                  bugunki = sum(1 for k in kayitlar if k.get("tarih","")[:10] == bugun)
              except Exception:
                  pass

          kalan = max(0, hedef - bugunki)
          devam = "true" if kalan > 0 else "false"
          print(f"Bugün üretilen: {bugunki}/{hedef} | Kalan: {kalan} | Devam: {devam}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"bugunki={bugunki}\n")
              f.write(f"kalan={kalan}\n")
              f.write(f"devam={devam}\n")
          PYEOF

      - name: Klasör yapısını hazırla
        if: steps.kapasite.outputs.devam == 'true' || github.event.inputs.force == 'true'
        run: |
          mkdir -p bobi_tv/{queue,assets/{fonts,sfx},production/{scripts/arena,tts,render},output,archive/published,logs,config}

      - name: BOBİ TV v6.2 Pro Pipeline'ı çalıştır
        if: steps.kapasite.outputs.devam == 'true' || github.event.inputs.force == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SAVE_UPDATED_COOKIES: /tmp/updated_arena_cookies.json
          GUNLUK_HEDEF: '1'
          GUNLUK_MAKS: '96'
          MOD: 'isindirma_15dk'
          OTOMATIK_SIL_AKTIF: '1'
          MIN_IZLENME_ESIGI: '100'
          IZLENME_KONTROL_DK: '60'
        run: |
          python main_pipeline.py

      - name: Üretilen Pro MP4 ve 1. Kare Kapağı Artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bobi-tv-v6-pro-video-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 5
          path: |
            bobi_tv/output/*.mp4
            bobi_tv/output/*_thumb.jpg
            bobi_tv/logs/quality/*.jsonl

      - name: Yenilenen Arena çerezini GitHub Secret'a geri kaydet
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -s /tmp/updated_arena_cookies.json ]; then
            gh secret set ARENA_COOKIES_JSON --repo "${{ github.repository }}" < /tmp/updated_arena_cookies.json || true
            shred -u /tmp/updated_arena_cookies.json || rm -f /tmp/updated_arena_cookies.json
            echo "ARENA_COOKIES_JSON güncellendi."
          fi

      - name: Günlük kalite istatistiklerini göster
        if: always()
        run: |
          python - << 'PYEOF'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          tarih = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          log_dosya = Path(f"bobi_tv/logs/quality/{tarih}.jsonl")

          if not log_dosya.exists():
              print("Bugün için kalite kaydı yok.")
          else:
              kayıtlar = []
              with open(log_dosya, "r", encoding="utf-8") as f:
                  for satir in f:
                      try:
                          kayıtlar.append(json.loads(satir))
                      except Exception:
                          continue

              if not kayıtlar:
                  print("Bugün için kalite kaydı yok.")
              else:
                  toplam = len(kayıtlar)
                  puanlar = [k["toplam_puan"] for k in kayıtlar]
                  gecen = sum(1 for k in kayıtlar if k["gecti"])

                  print(f"\n📊 GÜNLÜK KALİTE RAPORU ({tarih})")
                  print(f"{'='*40}")
                  print(f"Toplam video: {toplam}")
                  print(f"Ortalama puan: {round(sum(puanlar)/toplam, 1) if toplam > 0 else 0}")
                  print(f"Geçen: {gecen}/{toplam} ({round(gecen/toplam*100) if toplam > 0 else 0}%)")
                  print(f"Min puan: {min(puanlar) if puanlar else 0}")
                  print(f"Max puan: {max(puanlar) if puanlar else 0}")
          PYEOF

      - name: Arşivi ve kuyruk durumunu commit et
        if: always()
        run: |
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git reset --hard HEAD  # Tüm değişiklikleri temizle
          git add bobi_tv/archive/ bobi_tv/queue/*.json bobi_tv/production/scripts/arena/ bobi_tv/logs/quality/*.jsonl 2>/dev/null || git add -u bobi_tv/archive/ bobi_tv/queue/ bobi_tv/production/scripts/arena/ bobi_tv/logs/quality/ || true
          if ! git diff --staged --quiet; then
            git commit -m "📺 BOBİ TV v6.3 arşiv/kuyruk/kalite [$(date +%Y-%m-%dT%H:%M)] [skip ci]"
            git pull --rebase origin main || exit 1
            git push || exit 1
            echo "✅ Arşiv push başarılı"
          fi

      - name: Hata bildirimi
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests, sys
          token = os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID','')
          saat = __import__('datetime').datetime.utcnow().strftime('%H:%M')
          if token and chat_id:
              try:
                  resp = requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                    json={'chat_id': chat_id,
                          'text': f'🔴 <b>BOBİ TV v6.2 ({saat} UTC) başarısız</b>\nhttps://github.com/mehetgege3-cmyk/bobi-tv/actions',
                          'parse_mode': 'HTML'}, timeout=10)
                  if resp.status_code >= 400:
                      print(f'Telegram HTTP {resp.status_code}: {resp.text}', file=sys.stderr)
                      sys.exit(1)
              except Exception as e:
                  print(f'Telegram hatası: {e}', file=sys.stderr)
                  sys.exit(1)
          "
