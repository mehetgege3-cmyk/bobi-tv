name: 🤖 Arena AI Test — Saat Sorgusu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Playwright Kurulumu
        run: |
          pip install playwright > /dev/null 2>&1
          playwright install chromium > /dev/null 2>&1

      - name: Arena AI'ye Saat Sor
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
        run: |
          python << 'SCRIPT'
          import asyncio
          import json
          import os
          from playwright.async_api import async_playwright
          
          cookies_json = os.getenv("ARENA_COOKIES_JSON", "")
          if not cookies_json:
              print("❌ ARENA_COOKIES_JSON secret ayarlanmamış")
              exit(1)
          
          try:
              cookies_data = json.loads(cookies_json)
          except json.JSONDecodeError:
              print("❌ ARENA_COOKIES_JSON geçerli JSON değil")
              exit(1)
          
          async def ask_arena():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context()
                  page = await context.new_page()
                  
                  # Cookies ekle
                  await context.add_cookies(cookies_data)
                  
                  print("📡 Arena.ai açılıyor...")
                  try:
                      await page.goto("https://arena.ai/", wait_until="load", timeout=60000)
                  except:
                      print("⚠️  load timeout, domcontentloaded ile deneniyor...")
                      await page.goto("https://arena.ai/", wait_until="domcontentloaded", timeout=45000)
                  
                  # Screenshot al
                  print("📸 Screenshot alınıyor...")
                  await page.screenshot(path="/tmp/arena_ui.png", full_page=False)
                  
                  # Input selector'larını tara
                  print("🔍 Input selector'ları taranıyor...")
                  selectors = [
                      'textarea',
                      'input[type="text"]',
                      '[contenteditable="true"]',
                      '[role="textbox"]',
                      'input',
                      '.chat-input',
                      '#message-input'
                  ]
                  
                  input_elem = None
                  for sel in selectors:
                      try:
                          elem = await page.query_selector(sel)
                          if elem:
                              print(f"✅ Input bulundu: {sel}")
                              input_elem = elem
                              break
                      except:
                          pass
                  
                  if not input_elem:
                      print("❌ Input alanı bulunamadı")
                      print("📝 Sayfa metni (ilk 2000 char):")
                      page_text = await page.text_content('body')
                      if page_text:
                          print(page_text[:2000])
                      else:
                          print("Sayfa metni boş")
                      return
                  
                  # Input'a soruyu yaz
                  print("⌨️  'Şu an saat kaç?' sorusu yazılıyor...")
                  await input_elem.fill("Şu an saat kaç?", timeout=10000)
                  
                  # Gönder
                  print("✅ Mesaj gönderiliyor...")
                  try:
                      await page.press('input, textarea', 'Enter')
                  except:
                      btn = await page.query_selector('button:has-text("Gönder"), button:has-text("Send")')
                      if btn:
                          await btn.click()
                  
                  # Yanıt bekle
                  print("⏳ Yanıt bekleniyor...")
                  await page.wait_for_timeout(5000)
                  
                  # Sonuç
                  page_text = await page.text_content('body')
                  print(f"\n🤖 Arena AI Yanıtı (ilk 1000 char):\n{page_text[:1000]}")
                  
                  await browser.close()
          
          try:
              asyncio.run(ask_arena())
          except Exception as e:
              print(f"❌ Hata: {e}")
              import traceback
              traceback.print_exc()
              exit(1)
          SCRIPT
