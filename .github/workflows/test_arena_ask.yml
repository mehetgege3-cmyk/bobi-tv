name: 🤖 Arena AI Test — Saat Sorgusu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Playwright Kurulumu
        run: |
          pip install playwright > /dev/null 2>&1
          playwright install chromium > /dev/null 2>&1

      - name: Arena AI'ye Saat Sor
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
        run: |
          python << 'SCRIPT'
          import asyncio
          import json
          import os
          from playwright.async_api import async_playwright
          
          cookies_json = os.getenv("ARENA_COOKIES_JSON", "")
          if not cookies_json:
              print("❌ ARENA_COOKIES_JSON secret ayarlanmamış")
              exit(1)
          
          try:
              cookies_data = json.loads(cookies_json)
          except json.JSONDecodeError:
              print("❌ ARENA_COOKIES_JSON geçerli JSON değil")
              exit(1)
          
          async def ask_arena():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context()
                  page = await context.new_page()
                  
                  # Cookies ekle
                  await context.add_cookies(cookies_data)
                  
                  print("📡 Arena.ai açılıyor...")
                  await page.goto("https://arena.ai/", wait_until="domcontentloaded", timeout=60000)
                  
                  # Input element'i bekle ve visible olana kadar bekle
                  print("🔍 Input element'i bulunuyor ve yüklenesi bekleniyor...")
                  try:
                      # Tüm olası input selector'larını dene
                      selectors = [
                          'input[type="text"]',
                          'textarea',
                          'input',
                          '[role="textbox"]',
                          '[contenteditable="true"]'
                      ]
                      
                      input_elem = None
                      for sel in selectors:
                          elem = page.locator(sel).first
                          # Element visible olana kadar bekle
                          try:
                              await elem.wait_for(state="visible", timeout=15000)
                              print(f"✅ Input visible: {sel}")
                              input_elem = elem
                              break
                          except:
                              pass
                      
                      if not input_elem:
                          print("❌ Input bulunamadı")
                          return
                  except Exception as e:
                      print(f"⚠️  Input bulma hatası: {e}")
                      return
                  
                  # Input'a soruyu yaz
                  print("⌨️  'Şu an saat kaç?' yazılıyor...")
                  await input_elem.fill("Şu an saat kaç?")
                  
                  # Gönder (Enter veya button click)
                  print("✅ Gönderiliyor...")
                  try:
                      await page.press('input, textarea', 'Enter')
                  except:
                      # Send button ara
                      send_btn = page.locator('button:has-text("Gönder"), button:has-text("Send")')
                      await send_btn.first.click()
                  
                  # AI yanıtı bekle (3-10 saniye)
                  print("⏳ Yanıt bekleniyor...")
                  await page.wait_for_timeout(8000)
                  
                  # Sayfadaki metni al
                  page_text = await page.text_content('body')
                  
                  # Saat bilgisini ara
                  if "saat" in page_text.lower():
                      idx = page_text.lower().find("saat")
                      print(f"\n🤖 Arena AI Cevabı:\n{page_text[max(0, idx-50):idx+200]}")
                  else:
                      print(f"\n📝 Arena Yanıtı (ilk 800 char):\n{page_text[:800]}")
                  
                  await browser.close()
          
          try:
              asyncio.run(ask_arena())
          except Exception as e:
              print(f"❌ Hata: {e}")
              import traceback
              traceback.print_exc()
              exit(1)
          SCRIPT
