name: Tek Seferlik Telegram Bildirim

on:
  workflow_dispatch:
    inputs:
      mesaj:
        description: "Gönderilecek mesaj"
        required: true
        default: "✅ bobi-tv düzeltmeleri tamamlandı"

jobs:
  bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Telegram'a bildir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests, sys
          token = os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID','')
          mesaj = '''${{ inputs.mesaj }}'''
          if not token or not chat_id:
              print('::error::Telegram secret yok'); sys.exit(1)
          resp = requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
            json={'chat_id': chat_id, 'text': mesaj, 'parse_mode': 'HTML'}, timeout=15)
          print(f'Telegram HTTP {resp.status_code}: {resp.text[:120]}')
          if resp.status_code >= 400: sys.exit(1)
          "
