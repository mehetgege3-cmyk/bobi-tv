name: BOBİ TV Telegram Bot Poller (güvenlik düzeltmeli)

on:
  schedule:
    # Her 5 dakikada bir bot mesajlarını kontrol et
    # (GitHub cron gerçekte daha seyrek çalışabilir; beklenti yönetimi)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  poll-messages:
    name: Telegram Bot Poll
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q requests

      - name: Bot mesajlarını kontrol et ve işle (uzun ömürlü döngü)
        # NEDEN DÖNGÜ: GitHub cron '*/5' fiilen çalışmıyor (ölçüm 2026-11-10:
        # poller günde 2 koşu, aralarında 168 dk; kullanıcı 3 saat cevap alamadı).
        # Kullanıcı mesajı Telegram'da bekler; poller çalışana kadar "tepki yok"
        # görünür ve biriken mesajlar toplu işlenir. Çözüm cron'a güvenmek değil,
        # tek koşuyu ~5.5 saat ayakta tutup 20 sn'de bir getUpdates çağırmak.
        # Adım 330 dk, job 350 dk; süre dolunca TEMİZ çıkış (exit 0) ve yeni koşu
        # devralır. TELEGRAM_DONGU_DK=0 → eski tek-seferlik davranış.
        timeout-minutes: 330
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TELEGRAM_DONGU_DK: '330'
          TELEGRAM_YOKLAMA_SN: '20'
          TELEGRAM_TUR_AZAMI: '20'
        run: |
          python - << 'PYEOF'
          import os, json, sys, time, requests
          from datetime import datetime, timezone
          from pathlib import Path

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not BOT_TOKEN:
              print("::error::TELEGRAM_BOT_TOKEN secret tanımlı değil")
              sys.exit(1)
          if not CHAT_ID:
              print("::error::TELEGRAM_CHAT_ID secret tanımlı değil")
              sys.exit(1)

          BASE_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"
          offset_file = Path("bobi_tv/state/telegram_offset.json")
          offset_file.parent.mkdir(parents=True, exist_ok=True)

          offset = 0
          offset_guncelleme = None
          if offset_file.exists():
              try:
                  _durum = json.loads(offset_file.read_text())
                  offset = int(_durum.get("offset", 0))
                  offset_guncelleme = _durum.get("guncelleme")
              except Exception:
                  pass

          DONGU_DK = int(os.environ.get("TELEGRAM_DONGU_DK", "0"))
          YOKLAMA_SN = int(os.environ.get("TELEGRAM_YOKLAMA_SN", "20"))
          baslangic = time.monotonic()

          def dongu_bitti() -> bool:
              """Döngü süresi doldu mu? DONGU_DK<=0 → tek seferlik (eski davranış)."""
              if DONGU_DK <= 0:
                  return True
              return (time.monotonic() - baslangic) >= DONGU_DK * 60

          ardisik_hata: list[str] = []
          print(f"[dongu] {DONGU_DK} dk boyunca {YOKLAMA_SN} sn aralıkla yoklanacak")

          while True:
              if dongu_bitti():
                  print("[dongu] sure doldu — temiz cikis (yeni kosu devralacak)")
                  sys.exit(0)

              try:
                  resp = requests.post(
                      f"{BASE_URL}/getUpdates",
                      json={"timeout": 5, "offset": offset, "allowed_updates": ["message", "callback_query"]},
                      timeout=15,
                  )
              except Exception as e:
                  # Ağ hatasi donguyu OLDURMEZ: 3 kez ust uste basarisiz olursa cik.
                  ardisik_hata.append(str(e)[:120])
                  if len(ardisik_hata) >= 3:
                      print(f"::error::Telegram API bağlantı hatası (3 deneme): {ardisik_hata[-1]}")
                      sys.exit(1)
                  print(f"::warning::Telegram API hatası, {YOKLAMA_SN} sn sonra tekrar: {ardisik_hata[-1]}")
                  time.sleep(YOKLAMA_SN)
                  continue

              if resp.status_code != 200:
                  print(f"::error::Telegram API HTTP hatası: {resp.status_code}")
                  sys.exit(1)

              data = resp.json()
              if not data.get("ok"):
                  print(f"::error::Telegram API başarısız: {data}")
                  sys.exit(1)
              ardisik_hata.clear()

              updates = data.get("result", [])
              if not updates:
                  time.sleep(YOKLAMA_SN)
                  continue

              from modules.telegram_bot import (
                  bekleyen_ayarlari_yeniden_dene,
                  bosuk_uyarisi_gonder,
                  updates_isle,
              )

              try:
                  bekleyen_durum = bekleyen_ayarlari_yeniden_dene()
                  if bekleyen_durum:
                      print(f"[ayar] bekleyen: {bekleyen_durum}")
              except Exception as bekleyen_hata:
                  print(f"::warning::Bekleyen ayar denemesi hata verdi: {bekleyen_hata}")

              bosuk_esigi = int(os.environ.get("TELEGRAM_BOSUK_ESIGI", "3"))
              bosuk = updates[0]["update_id"] - offset
              if offset > 0 and bosuk > bosuk_esigi:
                  if bosuk_uyarisi_gonder(bosuk, offset_guncelleme):
                      print(f"[bosluk] uyari gonderildi: {bosuk} guncelleme kayip")
                  else:
                      print("[bosluk] uyari gonderilemedi (logda kalir)")

              # TODO 28: tur başına iş sınırı — biriken kuyruk tek turu kilitlemez.
              tur_azami = int(os.environ.get("TELEGRAM_TUR_AZAMI", "20"))
              yeni_offset, islenen, reddedildi, kesinti = updates_isle(
                  updates, offset, azami=tur_azami
              )
              offset = yeni_offset
              offset_guncelleme = datetime.now(timezone.utc).isoformat()

              offset_file.write_text(json.dumps({
                  "offset": yeni_offset,
                  "guncelleme": offset_guncelleme,
              }))
              print(f"[offset] {yeni_offset} (islenen: {islenen}, reddedilen: {reddedildi})")

              if reddedildi > 0:
                  print(f"::warning:: {reddedildi} yetkisiz mesaj reddedildi — bot kullanıcı adı sızdırmış olabilir")
              if kesinti:
                  print("::error::Bir update işlenemedi; offset güvenli noktada tutuldu, kalan update'ler sonraki turda yeniden denenecek")
                  sys.exit(1)

              time.sleep(1)
          PYEOF

      - name: State dosyasını commit et
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # TODO 3c: offset commit'i her koşuda değil, en az 15 dakikada bir yapılır
          # (git tarihi çöpü azalır — M1). Kontrol shallow-clone'a güvenmez; dosyanın
          # son commit zamanı GitHub API üzerinden okunur. API erişilemezse davranış
          # eski hâline döner (commit yapılır — kayıptan kaçınma).
          SON_TARIH=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=bobi_tv/state/telegram_offset.json&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || echo "")
          if [ -n "$SON_TARIH" ]; then
            SON=$(date -d "$SON_TARIH" +%s)
            SIMDI=$(date +%s)
            FARK=$((SIMDI - SON))
            if [ "$FARK" -lt 900 ]; then
              echo "⏭️ Offset commit atlandı (son commit ${FARK} sn önce < 900 sn) — offset yerel dosyada güncel"
              exit 0
            fi
          fi
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git add -f bobi_tv/state/telegram_offset.json 2>/dev/null || true
          git add -f bobi_tv/state/telegram_menu.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Telegram bot state (offset + menü) [skip ci]" || true
            # P2: push başarısızlığı SESSİZCE YUTULMAZ — kırmızı tik şart.
            # Sessiz push kaybı, panelin kaydettiği offset'in kaybolması demektir:
            # sonraki koşu aynı offset'i yeniden işler ve bot cevapları tekrar eder.
            if ! git push origin main; then
              echo "::error::State push başarısız — offset kaybolabilir; sonraki koşu aynı offset'i yeniden işler"
              exit 1
            fi
          fi
