name: "🤖 Arena AI Test — Saat Sorgusu (v2, Oturum Canlı Tutma)"

# Her 6 saatte bir çalıştırarak Arena oturumunu canlı tutar (çerez yenilenir ve secret'a geri yazılır).
# Manuel tetikleme de mümkündür.
on:
  schedule:
    - cron: '17 */6 * * *'   # 06:17, 12:17, 18:17, 00:17 — tam saatlerden kaçın
  workflow_dispatch:
    inputs:
      prompt:
        description: "Arena Agent'a sorulacak soru"
        required: true
        default: "Şu an saat kaç? Lütfen sadece SS:DD formatında cevap ver."

permissions:
  contents: read

jobs:
  test-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıklar ve Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Çerez ön kontrolü
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
        run: |
          if [ -z "$ARENA_COOKIES_JSON" ]; then
            echo "::error::ARENA_COOKIES_JSON secret tanımlı değil. Tarayıcıdan Cookie-Editor ile arena.ai çerezlerini alıp secret'a yapıştır."
            exit 1
          fi
          if ! echo "$ARENA_COOKIES_JSON" | grep -q "arena-auth-prod-v1"; then
            echo "::error::Çerezlerde arena-auth-prod-v1 bulunamadı — oturum süresi dolmuş veya yanlış çerez alındı. Secret'ı yenile."
            exit 1
          fi
          echo "✅ Çerez ön kontrolü geçildi."

      - name: Arena Agent'a sor (production script ile)
        id: ask
        continue-on-error: true
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          SAVE_UPDATED_COOKIES: /tmp/updated-cookies.json
        run: |
          PROMPT="${{ inputs.prompt || 'Şu an saat kaç? Lütfen sadece SS:DD formatında cevap ver.' }}"
          node skills/arena-playwright-agent/scripts/arena-ask.mjs "$PROMPT" | tee yanit.txt
          echo "exit_kodu=$?" >> "$GITHUB_OUTPUT"

      - name: Yenilenen çerezleri secret'a geri kaydet (oturum canlı tutma)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -s /tmp/updated-cookies.json ]; then
            gh secret set ARENA_COOKIES_JSON --repo "${{ github.repository }}" < /tmp/updated-cookies.json || true
            shred -u /tmp/updated-cookies.json || rm -f /tmp/updated-cookies.json
            echo "✅ ARENA_COOKIES_JSON secret güncellendi (oturum yenilendi)."
          else
            echo "ℹ️  Yenilenen çerez bulunamadı veya GH_PAT yok — oturum yenilenmedi."
          fi

      - name: Cevap doğrulama (assertion)
        run: |
          if [ ! -s yanit.txt ]; then
            echo "::error::Arena'dan cevap alınamadı (yanit.txt boş). Muhtemelen oturum süresi dolmuş — çerezleri yenile."
            exit 1
          fi
          ICERIK=$(cat yanit.txt)
          echo "=== Arena cevabı ==="
          echo "$ICERIK"
          echo "===================="
          # Saat formatı (SS:DD) veya "saat" kelimesi veya en az bir rakam içermeli
          if echo "$ICERIK" | grep -qE '[0-9]{1,2}:[0-9]{2}|saat|[0-9]{2}'; then
            echo "✅ Cevap doğrulandı — saat bilgisi içeriyor."
          else
            echo "::warning::Cevap saat bilgisi içermiyor ama metin alındı (bot farklı formatta cevaplamış olabilir)."
          fi

      - name: Ekran görüntüsü + yanıt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-test-sonuc
          path: |
            arena-cevap.png
            yanit.txt
          if-no-files-found: ignore
