name: 🧹 BOBİ TV Otomatik Temizleme — <100 İzlenme Videoları Sil

on:
  schedule:
    # Saatte 1 kez: <100 izlenme videoları otomatik sil
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-low-views:
    name: <100 İzlenme Videoları Temizle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıklar Yükleme
        run: |
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: <100 İzlenme Videoları Temizle
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python << 'EOF'
          import json
          import os
          import sys
          from pathlib import Path
          from datetime import datetime
          
          try:
              from google.auth.transport.requests import Request
              from google.oauth2.credentials import Credentials
              from google_auth_oauthlib.flow import InstalledAppFlow
              from googleapiclient.discovery import build
              from googleapiclient.errors import HttpError
          except ImportError as e:
              print(f"Bağımlılık hatası: {e}", file=sys.stderr)
              sys.exit(1)
          
          # YouTube OAuth token'ını yükle
          token_json = os.getenv('YOUTUBE_TOKEN', '{}')
          try:
              token_data = json.loads(token_json)
          except json.JSONDecodeError:
              print("❌ YOUTUBE_TOKEN geçerli JSON değil", file=sys.stderr)
              sys.exit(1)
          
          # Credentials oluştur
          try:
              creds = Credentials.from_authorized_user_info(token_data, scopes=[
                  'https://www.googleapis.com/auth/youtube.force-ssl'
              ])
          except Exception as e:
              print(f"❌ Credentials oluşturulamadı: {e}", file=sys.stderr)
              sys.exit(1)
          
          # YouTube API client
          try:
              youtube = build('youtube', 'v3', credentials=creds)
          except Exception as e:
              print(f"❌ YouTube API bağlantısı başarısız: {e}", file=sys.stderr)
              sys.exit(1)
          
          # Kanalın tüm videolarını listele
          print("📺 Videoları taranıyor...")
          deleted_count = 0
          total_checked = 0
          
          try:
              request = youtube.search().list(
                  part='snippet',
                  forMine=True,
                  maxResults=50,
                  order='date',
                  type='video'
              )
              
              while request:
                  response = request.execute()
                  
                  for item in response.get('items', []):
                      video_id = item['id']['videoId']
                      title = item['snippet']['title']
                      total_checked += 1
                      
                      # Video istatistiklerini al
                      try:
                          stats = youtube.videos().list(
                              part='statistics',
                              id=video_id
                          ).execute()
                          
                          views = int(stats['items'][0]['statistics'].get('viewCount', 0))
                          
                          # <100 izlenme ise sil
                          if views < 100:
                              print(f"🗑️  Siliniyor: {title} ({views} görüntülenme)")
                              try:
                                  youtube.videos().delete(id=video_id).execute()
                                  deleted_count += 1
                              except HttpError as e:
                                  print(f"   ⚠️  Silinemedi: {e.resp.status} {e.content}", file=sys.stderr)
                          else:
                              print(f"✅ Kalan: {title} ({views} görüntülenme)")
                      
                      except HttpError as e:
                          print(f"   ⚠️  İstatistik alınamadı: {e.resp.status}", file=sys.stderr)
                  
                  # Sonraki sayfa
                  if 'nextPageToken' in response:
                      request = youtube.search().list_next(request, response)
                  else:
                      break
              
              print(f"\n✅ Temizleme tamamlandı: {deleted_count}/{total_checked} video silindi")
          
          except HttpError as e:
              print(f"❌ YouTube API hatası: {e.resp.status} {e.content}", file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print(f"❌ Beklenmeyen hata: {e}", file=sys.stderr)
              sys.exit(1)
          
          EOF

      - name: Temizleme Raporu
        if: always()
        run: |
          echo "📊 Otomatik Temizleme Raporu: $(date)"
          echo "Workflow: cleanup_low_views.yml"
          echo "Status: ${{ job.status }}"
