name: Arena AI Playwright Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Arena Agent'a sorulacak soru"
        required: true
        default: "merhaba kanka bana kendini tanıt."
  # İstersen oturumun düşmemesi için her 45 dakikada veya günde birkaç kez otomatik tetikleyebilirsin:
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  ask-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları ve Chromium'u kur
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Arena Agent'a soruyu gönder ve cevabı al
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
        run: |
          node skills/arena-playwright-agent/scripts/arena-ask.mjs "${{ inputs.prompt || 'merhaba kanka bana kendini tanıt.' }}" | tee yanit.txt

      # Otomatik çerez yenileme KALDIRILDI (Bölüm 3-A): zincir bozuktu, secret'ı bozardı.
      # Çerez düşünce smoke test exit 2 verir; kullanıcı elle yeniler.
      - name: Ekran görüntüsü ve yanıtı Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: arena-agent-sonuc
          path: |
            arena-cevap.png
            yanit.txt
