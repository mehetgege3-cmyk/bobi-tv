name: "Master token test"
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kur
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pynacl 'notebooklm-py[headless]'
      - name: Master token dene
        env:
          NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "secret uzunluk: ${#NOTEBOOKLM_MASTER_TOKEN_JSON} krkt"
          python3 - <<'PY'
          import os, json
          ham = os.environ.get("NOTEBOOKLM_MASTER_TOKEN_JSON", "")
          print("ilk 6:", ham[:6])
          print("son 6:", ham[-6:])
          try:
              d = json.loads(ham)
              print("JSON anahtarları:", list(d)[:8])
              for k, v in d.items():
                  if isinstance(v, str) and v.startswith("aas_et/"):
                      print(f"  {k}: aas_et/… (uzunluk {len(v)})")
          except Exception as e:
              print("JSON DEĞİL:", type(e).__name__, str(e)[:120])
          PY
          python3 tools/notebook_cerez_tazele.py 2>&1 | tail -20
