name: "🖼️ Arena Görsel Üretim Testi (kanıt)"

# AMAÇ: "Arena gerçekten kapak GÖRSELİ üretiyor mu?" sorusunu ÖLÇMEK.
# Kullanıcı: "ürettiği görseli bana göster, bir yalan var" (2026-11-12).
# Bu workflow tahmin etmez: Arena'ya gerçek kapak promptu gönderir, sayfada
# görsel belirirse indirir ve artifact olarak yükler. Belirmezse "GÖRSEL GELMEDİ"
# der ve sayfanın ekran görüntüsünü yükler (neden gelmediği görülsün).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gorsel-testi:
    name: Arena'ya kapak promptu gönder, görsel geldi mi?
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Arena'ya sor ve görseli yakala
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ARENA_IDLE_DK: "15"
          ARENA_MAKS_DK: "15"
        run: python tools/arena_gorsel_test.py

      - name: Sonucu iş özetine yaz
        if: always()
        run: |
          if [ -f kanit/arena_test_rapor.json ]; then
            {
              echo "### Arena görsel testi"
              echo '```json'
              cat kanit/arena_test_rapor.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Kanıtları yükle (görsel + ekran görüntüsü + rapor)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-gorsel-kanit
          path: kanit/
          if-no-files-found: warn
