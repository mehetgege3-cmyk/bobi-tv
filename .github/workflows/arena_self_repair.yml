name: Arena AI Autonomous Self-Repair

on:
  workflow_run:
    workflows:
      - "Arena AI Playwright Agent"
      - "BOBİ TV — Arena AI Senaryo Üretimi"
      - "🧹 BOBİ TV Otomatik Temizleme — <100 İzlenme Videoları Sil"
      - "BOBİ TV — Toplu Manuel Üretim Pipeline"
      - "BOBİ TV v6.4 PRO — Saatlik Üretim + Kota Takibi"
      - "BOBİ TV — Kanal Temizle"
      - "BOBİ TV Telegram Bot Poller (güvenlik düzeltmeli)"
      - "🤖 Arena AI Test — Saat Sorgusu (v2, Oturum Canlı Tutma)"
      - "BOBİ TV v6.0 — Uçtan Uca Kalite Testi"
      - "BOBİ TV — Haftalık Performans Raporu"
      - "Arena Smoke Test — Tanılama (manuel tetik)"
    types: [completed]

concurrency:
  group: arena-self-repair-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  repair:
    name: Diagnose with Arena, test, and push repair
    if: >-
      contains(fromJSON('["failure", "timed_out", "startup_failure", "action_required"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Set up Python and quality tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Download failed run logs and metadata
        id: failed-run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,name,headSha,headBranch,conclusion > "$RUNNER_TEMP/failed-run.json"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/failure.log" || true
          if [ ! -s "$RUNNER_TEMP/failure.log" ]; then
            echo "GitHub returned no logs for failed run $RUN_ID" > "$RUNNER_TEMP/failure.log"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "workflow=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$RUNNER_TEMP/failed-run.json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["headSha"])' "$RUNNER_TEMP/failed-run.json")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["conclusion"])' "$RUNNER_TEMP/failed-run.json")" >> "$GITHUB_OUTPUT"

      - name: Build a bounded, secret-redacted repair prompt
        env:
          RUN_ID: ${{ steps.failed-run.outputs.run_id }}
          WORKFLOW_NAME: ${{ steps.failed-run.outputs.workflow }}
          HEAD_SHA: ${{ steps.failed-run.outputs.head_sha }}
          CONCLUSION: ${{ steps.failed-run.outputs.conclusion }}
          FAILURE_LOG: ${{ runner.temp }}/failure.log
          PROMPT_FILE: ${{ runner.temp }}/arena-repair-prompt.txt
        run: |
          python scripts/arena_self_repair.py build-prompt \
            --run-id "$RUN_ID" \
            --workflow "$WORKFLOW_NAME" \
            --head-sha "$HEAD_SHA" \
            --conclusion "$CONCLUSION" \
            --log-file "$FAILURE_LOG" \
            --output "$PROMPT_FILE"

      - name: Ask Arena AI to diagnose and return a unified patch
        env:
          ARENA_COOKIES_JSON: ${{ secrets.ARENA_COOKIES_JSON }}
          ARENA_PROMPT_FILE: ${{ runner.temp }}/arena-repair-prompt.txt
        run: |
          node arena-self-repair.mjs > "$RUNNER_TEMP/arena-answer.txt"
          test -s "$RUNNER_TEMP/arena-answer.txt"

      - name: Extract and apply Arena patch
        env:
          ANSWER_FILE: ${{ runner.temp }}/arena-answer.txt
          PATCH_FILE: ${{ runner.temp }}/arena-fix.patch
        run: |
          python scripts/arena_self_repair.py extract-patch \
            --answer-file "$ANSWER_FILE" \
            --output "$PATCH_FILE"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          git diff --check
          if [ -z "$(git status --porcelain)" ]; then
            echo "Arena patch did not modify the checkout."
            exit 1
          fi

      - name: Reinstall dependencies after proposed changes
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Run tests and static quality gates before any push
        run: |
          pytest -q
          mypy --strict
          ruff check
          ruff format --check
          python -m py_compile modules/scenario.py modules/tts_engine.py modules/video_render.py modules/animasyon.py

      - name: Commit and push the validated repair to main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RUN_ID: ${{ steps.failed-run.outputs.run_id }}
          WORKFLOW_NAME: ${{ steps.failed-run.outputs.workflow }}
        run: |
          set -euo pipefail
          git config user.name "BOBİ TV Bot"
          git config user.email "bobi-tv-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: Arena self-repair for run ${RUN_ID}"
          AUTH="basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: $AUTH" \
            git fetch origin main
          git rebase origin/main
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: $AUTH" \
            git push origin HEAD:main
          echo "Arena validated and pushed a repair for: ${WORKFLOW_NAME} (run ${RUN_ID})."
